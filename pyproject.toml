[project]
name = "sealsearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "split-folders>=0.6.1",
    "streamlit>=1.65.0",
    "torch>=2.7.0",
    "torchvision>=0.29.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
    { index = "pypi", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
    { index = "pypi", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true
